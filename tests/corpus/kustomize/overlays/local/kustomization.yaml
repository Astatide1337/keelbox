resources: [../../base]
namespace: corpus
components: [../../components/label]
patches:
  - target: {kind: Deployment, name: app}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
replacements:
  - source:
      kind: ConfigMap
      name: app-settings
      fieldPath: data.probe-path
    targets:
      - select: {kind: Deployment, name: app}
        fieldPaths: [spec.template.spec.containers.0.readinessProbe.httpGet.path]
