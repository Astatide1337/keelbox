apiVersion: v1
kind: ConfigMap
metadata: {name: app-server}
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "healthy\n"; }
      location = / { return 200 "corpus\n"; }
    }
---
apiVersion: v1
kind: Service
metadata: {name: app}
spec:
  selector: {app: app}
  ports: [{port: 80, targetPort: http}]
