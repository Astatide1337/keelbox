apiVersion: v1
kind: ConfigMap
metadata: {name: settings, namespace: demo}
data: {existing: yes}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: projection, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: projection}}
  template:
    metadata: {labels: {app: projection}}
    spec:
      containers: [{name: worker, image: busybox:1.37}]
      volumes:
        - name: config
          projected:
            sources:
              - configMap: {name: settings, items: [{key: missing, path: missing}]}
