apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}}}
    spec:
      containers:
        - name: web
          image: {{ .Values.image }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: {{ .Values.path }}, port: http}
          livenessProbe:
            httpGet: {path: {{ .Values.path }}, port: http}
          volumeMounts: [{name: server, mountPath: /etc/nginx/conf.d, readOnly: true}]
      volumes: [{name: server, configMap: {name: '{{ .Release.Name }}-server'}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: '{{ .Release.Name }}-server', namespace: '{{ .Release.Namespace }}'}
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "healthy\n"; }
      location = / { return 200 "corpus\n"; }
    }
