name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Repository layout
        run: make check-layout
      - name: Read lint version
        id: lint-version
        run: printf 'version=%s\n' "$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v${{ steps.lint-version.outputs.version }}
          args: --config=.golangci.yml ./...
      - name: Quality-policy enforcement
        run: make check-policy
      - name: Tests and race detection
        run: make test
      - name: Bounded parser fuzzing
        run: make fuzz
      - name: Build
        run: make build
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Reachable vulnerability scan
        run: make audit
