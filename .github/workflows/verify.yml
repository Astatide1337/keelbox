name: Verify local product package
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm pack
      - run: node scripts/verify-package.mjs
      - name: Clean install and executable check
        shell: bash
        run: |
          tarball=$(node -e "const p=require('./package.json');process.stdout.write(p.name+'-'+p.version+'.tgz')")
          mkdir /tmp/waypoint-install
          npm install --prefix /tmp/waypoint-install --omit=dev "$PWD/$tarball"
          /tmp/waypoint-install/node_modules/.bin/waypoint help
# No image builds, cluster creation, credentials, publishing, or deployment.
# Live tests require explicit disposable-runtime opt-in outside this workflow.
