apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: demo
data:
  default.conf: |
    server {
      listen 8080;
      location = / { return 200 "Waypoint local application\n"; }
      location = /healthz { return 200 "healthy\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
      volumes:
        - name: config
          configMap: {name: web-config}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: demo
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz { return 200 "gateway healthy\n"; }
      location / {
        proxy_pass http://web:80;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 502 504 =503 /upstream-unavailable;
      }
      location = /upstream-unavailable { internal; return 503 "gateway: upstream unavailable\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: demo
  annotations:
    waypoint.dev/http503-backend: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: nginx:1.28-alpine
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
      volumes:
        - name: config
          configMap: {name: gateway-config}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: demo
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 80, targetPort: 8080}]
