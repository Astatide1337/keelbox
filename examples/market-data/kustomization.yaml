apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waypoint-market-data
resources:
  - manifests/namespace.yaml
  - manifests/producer.yaml
  - manifests/consumer.yaml
  - manifests/producer-settings.yaml
configMapGenerator:
  - name: market-producer-code
    files:
      - src/producer.py
  - name: market-consumer-code
    files:
      - src/consumer.py
